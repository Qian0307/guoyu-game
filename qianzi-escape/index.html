<title>千字密室逃脫</title>

<style>
/* Layout concept: full-bleed first-person 3D room. Thin HUD around the edges, bamboo-slip puzzle cards float over the scene. Single dark look on purpose. */
:root{
  --ink:#0b1720; --ink-2:#13283a; --line:#2b4d5f; --jade:#52d1a5; --jade-deep:#1c7d64;
  --slip:#e8efe6; --slip-2:#d3e1d4; --slip-ink:#14262e; --gold:#f2b632; --gold-deep:#a9780f;
  --seal:#d9482f; --mist:#a9c2c0; --ok:#1f7a55; --text:#e6f1ee;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{font-family:var(--body);font-size:17px;line-height:1.6;color:var(--text);padding:0}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--ink)}
#view.drag{cursor:grabbing}
#view.hot{cursor:pointer}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:30}
#fade.on{opacity:1;pointer-events:auto}
#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:var(--ink);z-index:40;font-family:var(--display);font-size:22px;color:var(--gold);padding:24px}

.hud{position:fixed;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
.top{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chip{background:rgba(11,23,32,.78);border:1px solid var(--line);border-radius:6px;padding:6px 12px;backdrop-filter:blur(4px)}
.room{font-family:var(--display);font-weight:900;font-size:20px;color:var(--gold);letter-spacing:.08em}
.room small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--mist);letter-spacing:0}
.tools{display:flex;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--gold);position:relative;display:inline-block}
.coin::after{content:"";position:absolute;inset:6px;background:var(--ink)}
.coins.bump .coin{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5) rotate(20deg)}}
.mini{font:inherit;font-size:14px;background:rgba(11,23,32,.78);border:1px solid var(--line);color:var(--mist);border-radius:6px;padding:6px 10px;cursor:pointer}
.bottom{bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.slots{display:flex;gap:8px;align-items:center}
.slot{width:52px;height:52px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:8px;background:rgba(11,23,32,.7);font-family:var(--display);font-weight:900;font-size:28px;color:var(--line)}
.slot.on{border:2px solid var(--gold);color:var(--gold);background:rgba(11,23,32,.9);box-shadow:0 0 14px rgba(242,182,50,.55)}
.slots .lab{font-size:13px;color:var(--mist);margin-right:4px}
.joy{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(11,23,32,.55);border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.joy .jl{position:absolute;inset:0;display:grid;place-items:center;color:rgba(169,194,192,.45);font-weight:700;font-size:15px;pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(242,182,50,.82);border:2px solid #ffe08a;box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none}
.hud .slots{pointer-events:none}
@media (pointer:coarse){.mini{font-size:16px;padding:10px 14px}.joy{width:150px;height:150px}.joy .knob{width:70px;height:70px;margin:-35px 0 0 -35px}}
#tip{position:fixed;z-index:9;pointer-events:none;background:rgba(11,23,32,.9);border:1px solid var(--gold-deep);color:var(--gold);font-weight:700;padding:3px 10px;border-radius:4px;font-size:15px;transform:translate(14px,-34px);white-space:nowrap}
#toast{position:fixed;z-index:12;left:50%;top:max(70px,calc(env(safe-area-inset-top,0px) + 62px));transform:translateX(-50%);max-width:min(620px,calc(100% - 32px));background:rgba(11,23,32,.92);border:1px solid var(--line);border-left:6px solid var(--seal);border-radius:6px;padding:10px 16px;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
#toast b{color:var(--gold)}
#help{position:fixed;z-index:8;left:50%;bottom:max(86px,calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);font-size:14px;color:var(--mist);background:rgba(11,23,32,.7);padding:4px 12px;border-radius:20px;pointer-events:none;transition:opacity 1s;text-align:center;max-width:calc(100% - 32px)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.card{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--slip);color:var(--slip-ink);border-radius:8px;padding:22px max(16px,3vw) 24px;border-top:6px solid var(--jade-deep);border-bottom:6px solid var(--jade-deep);box-shadow:0 14px 50px rgba(0,0,0,.6);
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),rgba(20,38,46,.08) calc(20% - 1px),rgba(20,38,46,.08) 20%)}
.card.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tag{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.14em;color:#fff;background:var(--jade-deep);padding:1px 10px;border-radius:2px;margin-bottom:8px}
.big{font-family:var(--display);font-weight:900;font-size:clamp(32px,8vw,54px);letter-spacing:.14em;text-align:center;line-height:1.3;margin:4px 0 10px;text-wrap:balance}
.big em{font-style:normal;color:#c98a00;text-shadow:0 0 1px #c98a00}
h2.t{font-family:var(--display);font-size:25px;margin:0 0 8px;text-wrap:balance}
.ask{margin:0 0 12px;font-size:18px}
.small{font-size:15px;color:#3b5560}
.ans{display:flex;gap:10px;flex-wrap:wrap}
input.t{flex:1 1 180px;min-width:0;font:inherit;font-size:22px;padding:10px 14px;border:2px solid var(--slip-ink);border-radius:6px;background:#fff;color:var(--slip-ink)}
input.t:disabled{background:#cfdacf;border-color:#8ea39a}
.btn{font:inherit;font-weight:700;font-size:18px;background:var(--jade-deep);color:#fff;border:0;border-radius:6px;padding:11px 20px;cursor:pointer;box-shadow:0 3px 0 #0f4a3c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f4a3c}
.btn.alt{background:transparent;color:var(--slip-ink);border:2px solid var(--slip-ink);box-shadow:none}
.btn.gold{background:var(--gold);color:#3a2800;box-shadow:0 3px 0 var(--gold-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.mini:focus-visible,.tray button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ghost{font:inherit;font-size:14px;background:none;border:0;color:#46636d;text-decoration:underline;cursor:pointer;padding:6px 2px}
.hint{margin:10px 0 0;padding:8px 12px;background:#fff6d6;border-left:5px solid var(--gold);font-size:16px}
.fb{min-height:1.6em;margin-top:8px;font-weight:700}
.fb.bad{color:#b3331e}.fb.good{color:var(--ok)}
.tray{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tray button{font-family:var(--display);font-weight:900;font-size:28px;width:54px;height:54px;border:2px solid var(--slip-ink);background:#fff;border-radius:6px;cursor:pointer;color:var(--slip-ink)}
.res{margin-top:14px;padding:12px 16px;background:var(--slip-2);border-left:6px solid var(--jade-deep);border-radius:2px}
.res b.ok{color:var(--ok)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.chip2{background:var(--ink);color:#fff;border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.35;border:2px solid var(--gold-deep)}
.chip2 b{display:block;font-family:var(--display);font-size:28px;color:var(--gold);line-height:1.1}
.chip2 .e{font-size:20px}
.lines{border:2px solid var(--slip-ink);border-radius:6px;padding:8px 14px;background:rgba(255,255,255,.55);margin:6px 0 12px}
.lines p{margin:4px 0;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.18em}
.stamp{display:inline-block;border:4px solid var(--seal);color:var(--seal);font-family:var(--display);font-weight:900;font-size:30px;padding:6px 16px;border-radius:6px;transform:rotate(-6deg);letter-spacing:.2em}
.center{text-align:center}
.teach{width:min(560px,100%)}
.teach .row .btn{font-size:15px;padding:8px 14px}
.teach textarea{width:100%;min-height:140px;margin-top:10px;font:inherit;font-size:14px;border:2px solid var(--slip-ink);border-radius:6px;padding:8px;background:#fff;color:var(--slip-ink)}
@media (max-width:560px){.slot{width:44px;height:44px;font-size:24px}.room{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

var actx=null;
function beep(kind){
  if(S.muted){return;}
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC){return;}
    actx=actx||new AC();
    var seq=kind==="ok"?[[660,0],[880,.1],[1100,.2]]:kind==="bad"?[[220,0],[180,.12]]:[[880,0],[1320,.1]];
    seq.forEach(function(n){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,actx.currentTime+n[1]);
      g.gain.exponentialRampToValueAtTime(.12,actx.currentTime+n[1]+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+n[1]+.2);
      o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+n[1]);o.stop(actx.currentTime+n[1]+.22);
    });
  }catch(e){}
}

function mkCanvas(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function ctex(c,rx,ry){var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;if(rx){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);}return t;}
function wallTex(base,line,rx,ry){
  var c=mkCanvas(256,256),g=c.getContext("2d");
  g.fillStyle=base;g.fillRect(0,0,256,256);
  for(var i=0;i<900;i++){g.fillStyle="rgba(0,0,0,"+(Math.random()*.08)+")";g.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*6,1+Math.random()*3);}
  g.strokeStyle=line;g.lineWidth=3;
  for(var x=0;x<=256;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,256);g.stroke();}
  g.beginPath();g.moveTo(0,128);g.lineTo(256,128);g.stroke();
  return ctex(c,rx,ry);
}
function floorTex(c1,c2,rx){
  var c=mkCanvas(256,256),g=c.getContext("2d");
  for(var i=0;i<2;i++){for(var j=0;j<2;j++){g.fillStyle=(i+j)%2?c1:c2;g.fillRect(i*128,j*128,128,128);}}
  for(var k=0;k<600;k++){g.fillStyle="rgba(0,0,0,"+(Math.random()*.07)+")";g.fillRect(Math.random()*256,Math.random()*256,3+Math.random()*8,2);}
  g.strokeStyle="rgba(0,0,0,.35)";g.lineWidth=2;g.strokeRect(0,0,256,256);g.strokeRect(0,0,128,128);g.strokeRect(128,128,128,128);
  return ctex(c,rx,rx);
}
function textTex(text,w,h,fg,bg,size,vertical){
  var c=mkCanvas(w,h),g=c.getContext("2d");
  if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h);}
  g.fillStyle=fg;g.textAlign="center";g.textBaseline="middle";
  if(vertical){
    var chars=text.split(""),step=size*1.15,y0=h/2-(chars.length-1)*step/2;
    g.font="900 "+size+"px "+FONT;
    chars.forEach(function(ch,i){g.fillText(ch,w/2,y0+i*step);});
  }else{g.font="900 "+size+"px "+FONT;g.fillText(text,w/2,h/2);}
  return ctex(c);
}

var keys={},modalOpen=false;
var KEYMAP={KeyW:"f",ArrowUp:"f",KeyS:"b",ArrowDown:"b",KeyA:"sl",KeyD:"sr",ArrowLeft:"tl",ArrowRight:"tr",KeyQ:"tl",KeyE:"tr"};

var jx=0,jy=0,joyId=null;
(function(){
  var joy=$("joy"),knob=$("knob");
  function upd(e){
    var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-8;
    var dx=e.clientX-cx,dy=e.clientY-cy,d=Math.sqrt(dx*dx+dy*dy);
    if(d>R){dx=dx/d*R;dy=dy/d*R;}
    knob.style.transform="translate("+dx+"px,"+dy+"px)";
    var nx=dx/R,ny=dy/R;
    jx=Math.abs(nx)<.15?0:nx;jy=Math.abs(ny)<.15?0:ny;
  }
  function end(){joyId=null;jx=0;jy=0;knob.style.transform="translate(0,0)";}
  joy.addEventListener("pointerdown",function(e){if(modalOpen){return;}e.preventDefault();joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId);}catch(x){}upd(e);$("help").style.opacity=0;});
  joy.addEventListener("pointermove",function(e){if(e.pointerId===joyId){upd(e);}});
  joy.addEventListener("pointerup",function(e){if(e.pointerId===joyId){end();}});
  joy.addEventListener("pointercancel",function(e){if(e.pointerId===joyId){end();}});
  joy.addEventListener("lostpointercapture",function(){end();});
})();

var drag=null;
canvas.addEventListener("pointerdown",function(e){

var ray=new T.Raycaster(),v2=new T.Vector2();
function pick(x,y){
  v2.set(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);
  ray.setFromCamera(v2,camera);
  var hits=ray.intersectObjects(hotRoots,true);
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object;
    while(o&&!(o.userData&&o.userData.hot)){o=o.parent;}
    if(o){return o.userData.hot;}
  }
  return null;
}
function objById(id){for(var i=0;i<OBJS.length;i++){if(OBJS[i].id===id){return OBJS[i];}}return null;}

function interact(id){
  var h=hot[id];if(!h){return;}
  var wp=new T.Vector3();h.root.updateMatrixWorld(true);h.root.getWorldPosition(wp);
  var dx=wp.x-camera.position.x,dz=wp.z-camera.position.z;
  if(Math.sqrt(dx*dx+dz*dz)>h.root.userData.dist){toast("再<b>走近一點</b>!按 W 或 ▲ 往前走。",2600);return;}
  if(id.charAt(0)==="k"){collectCoin(id);}
  else if(id==="door"){openDoor();}
  else if(id==="chest"){openChest();}
  else{var o=objById(id);if(o){openObj(o);}}
}

var last=performance.now(),tAcc=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000);last=now;tAcc+=dt;
  if(!modalOpen){
    var sp=2.8*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    var mx=0,mz=0;
    if(keys.f){mx+=fx;mz+=fz;}if(keys.b){mx-=fx;mz-=fz;}if(keys.sl){mx-=rx;mz-=rz;}if(keys.sr){mx+=rx;mz+=rz;}
    if(jx||jy){mx+=fx*(-jy)+rx*jx;mz+=fz*(-jy)+rz*jx;}
    if(keys.tl){yaw+=1.6*dt;}if(keys.tr){yaw-=1.6*dt;}
    var px=camera.position.x+mx*sp,pz=camera.position.z+mz*sp;
    px=Math.max(-4.3,Math.min(4.3,px));pz=Math.max(-4.3,Math.min(4.3,pz));
    for(var i=0;i<obstacles.length;i++){
      var o=obstacles[i],ddx=px-o[0],ddz=pz-o[1],d=Math.sqrt(ddx*ddx+ddz*ddz);
      if(d<o[2]+.3){var k=(o[2]+.3)/(d||.001);px=o[0]+ddx*k;pz=o[1]+ddz*k;}
    }
    camera.position.x=px;camera.position.z=pz;
  }
  camera.rotation.set(pitch,yaw,0);

  flickers.forEach(function(f){f.l.intensity=f.b*(.82+.18*Math.sin(tAcc*9+f.p)*Math.sin(tAcc*5.3+f.p));});
  spins.forEach(function(g){g.rotation.y+=dt*2.4;});

  for(var a=anim.length-1;a>=0;a--){if(anim[a].run(dt)){anim.splice(a,1);}}

  sp.scale.set(.9,.9,.9);sp.position.copy(p);group.add(sp);
  var n=48,pos=new Float32Array(n*3),vel=[];
  for(var i=0;i<n;i++){pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;vel.push([(Math.random()-.5)*2.4,Math.random()*2.2,(Math.random()-.5)*2.4]);}

      if(lg&&lg.ok){
        var line="・"+o.name+"("+o.kind+"):"+o.key+(lg.wrong?" 錯"+lg.wrong+"次":" 一次過")+(o.rad?(lg.radOk?";部首✓":";部首未答對"):"");
        if(o.explain&&lg.text){line+=";說「"+LINES[o.line].t+"」:「"+sh(lg.text,26)+"」";}
        out.push(line);
      }else{out.push("・"+o.name+":未完成");undone.push(o.name);}
    });
    out.push("・大門密碼:"+(S["open"+r]?"✓":"未開"));
  }
  out.push("");out.push("終關・對仗寶庫");
  roomObjs(3).forEach(function(o){
    var lg=S.log[o.id];
    if(lg&&lg.ok){out.push("・"+o.name+":"+(o.kind==="創作"?"「"+(lg.text||"")+"」":o.kind==="大會考"?"大會考 "+(lg.score||0)+" / "+QUIZ.length+" 題一次答對":o.show.replace("＿",o.key)));}
    else{out.push("・"+o.name+":未完成");undone.push(o.name);}
  });
  out.push("・大寶箱:"+(S.won?"✓ 通關":"未開"));
  out.push("");out.push("尋寶銅錢找到 "+coinCount()+" / 12");out.push("銅錢:"+S.coins);
  if(undone.length){out.push("未完成(不算已教):"+undone.join("、"));}
  out.push("※只記錄實際完成的部分");
  return out.join("\n").slice(0,1900);
}
function copyReport(fb){
  var txt=report();
  var ok=function(){if(fb){fb.className="fb good";fb.textContent="已複製,貼到 Discord 就可以了";}};
  var fail=function(){if(fb){fb.className="fb";fb.textContent="複製失敗,請到「老師」面板手動複製";}showTeacher(txt);};
  try{navigator.clipboard.writeText(txt).then(ok,fail);}catch(e){fail();}
}
function showTeacher(txt){
  var was=modalOpen;
  showModal('<div class="teach"><div class="tag">老師工具</div><div class="row" id="tr"></div><textarea id="rep" readonly></textarea><div class="row" id="rw"></div></div>');
  function btn(l,fn,cls){var b=document.createElement("button");b.type="button";b.className="btn "+(cls||"alt");b.textContent=l;b.onclick=fn;$("tr").appendChild(b);return b;}
  btn("本房全部通過",function(){roomObjs(S.room).forEach(function(o){var lg=L(o.id);if(!lg.ok){lg.ok=true;lg.skipped=true;setMarkerDone(o.id);}});save();hudSlots();hideModal();toast("本房機關已全部解開",2000);});
  btn("直接開門去下一房",function(){if(S.room<3){S["open"+S.room]=true;save();hideModal();goNext();}});
  btn("回上一房",function(){if(S.room>0){hideModal();fade(function(){S.room--;save();loadRoom(S.room);});}});
  btn("複製上課紀錄",function(){var t=$("rep");t.value=report();t.select();try{navigator.clipboard.writeText(t.value);}catch(e){}});
  var rs=false,rb=btn("重新開始",function(){if(!rs){rs=true;rb.textContent="再按一次確定";setTimeout(function(){rs=false;rb.textContent="重新開始";},3000);return;}S={room:0,coins:0,log:{},muted:S.muted};save();hideModal();fade(function(){loadRoom(0);});});
  $("rep").value=txt||report();
  $("rw").appendChild(closeBtn("關閉",hideModal));
  if(txt){$("rep").focus();$("rep").select();}
}
$("tbtn").onclick=function(){if(!modalOpen){showTeacher();}};
$("mute").onclick=function(){S.muted=!S.muted;save();hudSlots();};
window.addEventListener("keydown",function(e){if(e.key==="Escape"&&modalOpen){hideModal();}});

window.__vault={S:function(){return S;},interact:interact,openObj:openObj,report:report,cam:camera,hot:function(){return hot;}};
